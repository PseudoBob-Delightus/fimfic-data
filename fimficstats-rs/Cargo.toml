[package]
name = "fimfic-stats"
version = "0.1.0"
description = "CLI tools for scraping statistics from FIMFiction."
repository = "https://github.com/PseudoBob-Delightus/fimfic-data"
authors = ["Silk Rose", "Meadowsys"]
edition = "2021"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.38" }
lazy_static = { version = "1.5.0" }
pony = { git = "https://github.com/SilkRose/Pony" }
reqwest = { version = "0.12.5", features = ["json"] }
rusqlite = { version = "0.32.0", features = ["bundled"] }
scraper = { version = "0.19.1" }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = { version = "1.0.120", features = ["preserve_order"] }
tokio = { version = "1.39.1", features = ["full"] }

[profile.dev]
opt-level = 0
debug-assertions = true
debug = true
incremental = true

[profile.release]
strip = true
opt-level = 3
debug-assertions = false
lto = true
codegen-units = 1
